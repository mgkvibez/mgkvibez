name: Update GitHub metrics (contribution city)

on:
  schedule:
    - cron: "0 3 * * *"    # daily at 3am UTC, offset from the snake job
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate isometric contribution city + language/habit stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: mgkvibez
          template: classic
          base: header, activity, community, repositories
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 15
          plugin_habits: yes
          plugin_habits_charts_type: classic
          config_timezone: Africa/Lagos
          filename: assets/images/metrics.svg
