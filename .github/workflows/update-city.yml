name: update-city

# Redraws the animated isometric skyline in assets/city-*.svg from the live
# contribution calendar. The SVGs are self-contained (no JS, no external CSS),
# so the profile renders them straight from the repo.
on:
  schedule:
    - cron: "17 */6 * * *"      # every six hours, off the hour to dodge the queue
  push:
    branches: [main]
    paths:
      - "scripts/generate-city.mjs"
      - ".github/workflows/update-city.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-city
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Render the city
        env:
          # GH_PAT sees private contributions; without it the built-in token
          # still works, but the calendar only counts public work.
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CITY_LOGIN: mgkvibez
        run: node scripts/generate-city.mjs

      - name: Commit if the city moved
        run: |
          git config user.name "contribution-city[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/city-gold.svg assets/city-neon.svg README.md
          if git diff --quiet --cached; then
            echo "nothing changed"
          else
            git commit -m "chore(city): redraw the skyline from live contributions"
            git push
          fi
