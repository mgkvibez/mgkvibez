name: arcade

# Pac-Man and Galaga, drawn from the same contribution calendar as the snake.
# Third-party action pinned by commit; outputs land in dist/ and are copied to
# assets/images with stable names before the rebase-and-commit step, exactly
# like the snake job.
on:
  schedule:
    - cron: "30 0 * * *"     # daily, half an hour after the snake
  workflow_dispatch:

permissions:
  contents: write

# Queue, never cancel: a cancelled head run leaves the badge red.
concurrency:
  group: arcade
  cancel-in-progress: false

jobs:
  arcade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate the Pac-Man graph
        # pinned 2026-11-13 to abozanona/pacman-contribution-graph@main
        uses: abozanona/pacman-contribution-graph@70945878b1118303b37b88060fc7145e1a57d7b1
        with:
          github_user_name: mgkvibez
          # CARDS_TOKEN is the owner's PAT, so private contributions count.
          # Falls back to the built-in token (public only) if it is missing.
          github_token: ${{ secrets.CARDS_TOKEN || secrets.GITHUB_TOKEN }}
          games: pacman
          hide_month_labels: "false"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Retheme into the profile palette and frame the game
        env:
          CARDS_TOKEN: ${{ secrets.CARDS_TOKEN }}
        run: |
          set -euo pipefail
          # Reads the action's dist/ output, repaints GitHub's stock greens onto
          # this profile's phosphor ramp and sets each game in a CRT window with
          # a live score line. Aborts without touching assets/ if it cannot.
          node scripts/arcade-retheme.mjs --in dist --out assets/images

      - name: Refuse to commit a blank or static graph
        run: |
          set -euo pipefail
          for f in assets/images/arcade-*.svg; do
            size=$(wc -c < "$f")
            if [ "$size" -lt 20000 ]; then
              echo "::error::$f looks empty ($size bytes)"
              exit 1
            fi
            if ! grep -qE "<animate|@keyframes|<style" "$f"; then
              echo "::error::$f contains no animation"
              exit 1
            fi
          done
          node -e '
            const fs = require("fs");
            for (const f of fs.readdirSync("assets/images").filter((n) => n.startsWith("arcade-"))) {
              const s = fs.readFileSync("assets/images/" + f, "utf8");
              if (!s.startsWith("<svg") || !s.includes("</svg>")) { console.error(f + " is not a single SVG"); process.exit(1); }
              if (!s.includes(`arcade --`)) { console.error(f + " is missing the frame"); process.exit(1); }
            }
            console.log("all four graphs carry animation, real content and the CRT frame");
          '

      - name: Rebase on latest main before committing
        run: git pull --rebase --autostash origin main

      - name: Commit updated arcade SVGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh arcade contribution graphs"
          file_pattern: assets/images/arcade-*.svg assets/.arcade-stats.json
