name: cards

# Renders the custom SVG cards (training log, port scan, model registry,
# oscilloscope) from live GitHub data and commits them back — the profile
# serves its own images instead of depending on third-party badge APIs.
on:
  schedule:
    # Hourly — keeps the city sky in real West African Time and
    # raises a new skyscraper within the hour of any new repo. :07
    # stays off the hour to dodge the pile-up on shared runners.
    - cron: "7 * * * *"
  push:
    branches: [main]
    paths:
      - "cards/**"
      - "scripts/**"
      - "testdata/**"
      - ".github/workflows/cards.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest cards.test_cards -v

      - name: Render cards
        env:
          # CARDS_TOKEN (the owner's PAT) also sees private repos, so the
          # city can raise them as anonymous dark towers. Falls back to
          # the built-in token (public only) if the secret is missing.
          GITHUB_TOKEN: ${{ secrets.CARDS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python -m cards.render --login "${{ github.repository_owner }}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Render the terminal hero
        env:
          # same PAT as the cards, so private repo counts feed the totals
          CARDS_TOKEN: ${{ secrets.CARDS_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/generate-hero.mjs --out assets/hero.svg

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards assets/hero.svg history.jsonl README.md
          if git diff --cached --quiet; then
            echo "cards unchanged"
            exit 0
          fi
          git commit -m "cards: refresh from live profile data"
          # another workflow may have committed while we were rendering; snake
          # and arcade both rebase first, and this one was losing that race
          git pull --rebase --autostash origin main
          git push
