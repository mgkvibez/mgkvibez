name: cards

# Renders the custom SVG cards (training log, port scan, model registry,
# oscilloscope) from live GitHub data and commits them back — the profile
# serves its own images instead of depending on third-party badge APIs.
on:
  schedule:
    # Hourly — keeps the city sky in real West African Time and
    # raises a new skyscraper within the hour of any new repo. :07
    # stays off the hour to dodge the pile-up on shared runners.
    - cron: "7 * * * *"
  push:
    branches: [main]
    paths:
      - "cards/**"
      - "testdata/**"
      - ".github/workflows/cards.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest cards.test_cards -v

      - name: Render cards
        env:
          # The built-in token sees public repos only — the profile and its
          # portfolio are public, which is all these cards need.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m cards.render --login "${{ github.repository_owner }}"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards
          if git diff --cached --quiet; then
            echo "cards unchanged"
            exit 0
          fi
          git commit -m "cards: refresh from live profile data"
          git push
