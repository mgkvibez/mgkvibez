<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Terminal boot sequence for mgkvibez</title>
  <desc id="heroDesc">A CRT terminal types an ssh session, then prints 47 public repositories, 110 stars, 31 followers and the top languages.</desc>
  <defs>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#39d353" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="screenWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="1" stop-color="#39d353" stop-opacity="0.04"/>
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.4" fill="#000000" opacity="0.16"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 16px; fill: #c9d1d9; letter-spacing: 0.2px; }
      .lbl { fill: #8b949e; font-size: 13.5px; letter-spacing: 1.2px; }
      .title { fill: #8b949e; font-size: 12px; letter-spacing: 1px; }
      .big { fill: #00ff41; font-size: 15px; }
      /* Everything is visible by default: motion is an enhancement, never a
         precondition for reading the card. Reduced motion simply keeps the
         finished frame. */
      @media (prefers-reduced-motion: no-preference) {
        .typeline { animation: wipe 0.55s steps(28, end) var(--d) both; }
        .row { animation: fade 0.5s ease-out var(--d) both; }
        .cursor { animation: blink 1.1s steps(2, start) infinite; }
        .sweep { animation: sweep 9s linear infinite; }
        .flicker { animation: flicker 7s ease-in-out infinite; }
        .emblem { animation: fade 0.9s ease-out 1.5s both; }
      }
      @keyframes wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
      @keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes sweep { from { transform: translateY(0); } to { transform: translateY(364px); } }
      @keyframes flicker { 0%, 96%, 100% { opacity: 1; } 97% { opacity: 0.93; } 98.5% { opacity: 0.98; } }
    </style>
  </defs>

  <rect width="1200" height="420" fill="#0a0e14"/>
  <g class="flicker">
    <rect x="8" y="8" width="1184" height="404" rx="12" fill="#0d1117" stroke="#1f2730"/>
    <path d="M 8 48 H 1192" stroke="#1f2730"/>
    <rect x="20" y="20" width="1160" height="20" fill="none"/>
    <circle cx="34" cy="28" r="5" fill="#f85149"/>
    <circle cx="52" cy="28" r="5" fill="#e3b341"/>
    <circle cx="70" cy="28" r="5" fill="#39d353"/>
    <text x="92" y="33" class="title">visitor@github - ssh</text>
    <text x="1172" y="33" class="title" text-anchor="end">tty1 · 80x24</text>

    <rect x="9" y="48" width="1182" height="364" fill="url(#screenWash)"/>

    <text x="40" y="84" class="typeline" style="--d:0.25s">$ ssh visitor@github</text>
    <text x="238" y="84" class="typeline big" style="--d:0.85s; fill:#00ff41">auth ok</text>
    <text x="40" y="112" class="typeline" style="--d:1.15s">$ ./whoami --verbose</text>
    <rect class="cursor" x="232" y="99" width="9" height="15" fill="#00ff41"/>

    
    <g class="emblem">
      <path d="M 132 192 L 228 192 L 228 256.96
               Q 228 286 180 304
               Q 132 286 132 256.96 Z"
            fill="url(#shieldFill)" stroke="#00ff41" stroke-width="2.5" stroke-opacity="0.9"/>
      <path d="M 142 202 L 218 202 L 218 256.96
               Q 218 278 180 294
               Q 142 278 142 256.96 Z"
            fill="none" stroke="#39d353" stroke-width="1.2" stroke-opacity="0.45"/>
      <circle cx="180" cy="238" r="11" fill="#0d1117" stroke="#39d353" stroke-width="2"/>
      <rect x="175.5" y="244" width="9" height="24" rx="4.5" fill="#0d1117" stroke="#39d353" stroke-width="2"/>
    </g>
    <text x="180" y="330" fill="#00ff41" text-anchor="middle" font-size="14">@mgkvibez</text>
    <text x="180" y="350" class="lbl" text-anchor="middle">github.com/mgkvibez</text>

    <g class="row" style="--d:2.00s">
        <text x="316" y="178" class="lbl">HOST</text>
        <text x="430" y="178" fill="#c9d1d9">@mgkvibez</text>
      </g><g class="row" style="--d:2.12s">
        <text x="316" y="205" class="lbl">UPTIME</text>
        <text x="430" y="205" fill="#c9d1d9">1y 9m  since Feb 2025</text>
      </g><g class="row" style="--d:2.24s">
        <text x="316" y="232" class="lbl">REPOS</text>
        <text x="430" y="232" fill="#c9d1d9">47 public</text>
      </g><g class="row" style="--d:2.36s">
        <text x="316" y="259" class="lbl">STARS</text>
        <text x="430" y="259" fill="#00ff41">110</text>
      </g><g class="row" style="--d:2.48s">
        <text x="316" y="286" class="lbl">FOLLOWERS</text>
        <text x="430" y="286" fill="#c9d1d9">31</text>
      </g>
    <g class="row" style="--d:2.8s">
      <text x="316" y="323" class="lbl">FOCUS</text>
      <text x="430" y="323" fill="#c9d1d9">security tooling · CI/testing infra · AI agent tooling</text>
    </g>
    <g class="row" style="--d:3.20s">
        <circle cx="435" cy="351" r="5" fill="#3178c6"/>
        <text x="448" y="355" fill="#c9d1d9">TypeScript</text>
      </g><g class="row" style="--d:3.34s">
        <circle cx="537" cy="351" r="5" fill="#3572a5"/>
        <text x="550" y="355" fill="#c9d1d9">Python</text>
      </g><g class="row" style="--d:3.48s">
        <circle cx="608.6" cy="351" r="5" fill="#f1e05a"/>
        <text x="621.6" y="355" fill="#c9d1d9">JavaScript</text>
      </g><g class="row" style="--d:3.62s">
        <circle cx="710.6" cy="351" r="5" fill="#89e051"/>
        <text x="723.6" y="355" fill="#c9d1d9">Shell</text>
      </g><g class="row" style="--d:3.76s">
        <circle cx="774.6" cy="351" r="5" fill="#e34c26"/>
        <text x="787.6" y="355" fill="#c9d1d9">HTML</text>
      </g>

    <path d="M 32 378 H 1168" stroke="#1f2730" stroke-opacity="0.8"/>
    <text x="40" y="400" class="lbl" style="font-size:11.5px">read-only session · rendered from the live GitHub API · no credentials stored</text>
    <text x="1160" y="400" class="lbl" style="font-size:11.5px" text-anchor="end">2026-11-14</text>

    <rect x="9" y="48" width="1182" height="364" fill="url(#scanlines)" pointer-events="none"/>
    <g clip-path="url(#sweepClip)">
      <rect class="sweep" x="9" y="48" width="1182" height="26" fill="#00ff41" opacity="0.045"/>
    </g>
    <clipPath id="sweepClip"><rect x="9" y="48" width="1182" height="364"/></clipPath>
  </g>
</svg>
